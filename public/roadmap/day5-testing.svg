<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <!-- Background Grid -->
  <rect width="600" height="450" fill="#1C1917" />
  <defs>
    <pattern id="grid-qa" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#292524" stroke-width="1" />
    </pattern>
    <linearGradient id="rose-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#grid-qa)" />

  <!-- Shadow Base -->
  <ellipse cx="300" cy="395" rx="250" ry="38" fill="#0C0A09" opacity="0.8" />

  <!-- LEFT MONITOR: STRESS TEST AUDIT REPORT -->
  <g transform="translate(60, 80)">
    <!-- 3D CRT Back Extrusion -->
    <path d="M 180 30 L 210 20 L 210 170 L 180 190 Z" fill="#292524" stroke="#000" stroke-width="3" />
    <path d="M 0 30 L 180 30 L 210 20 L 30 20 Z" fill="#44403C" stroke="#000" stroke-width="3" />

    <!-- Monitor Face Body -->
    <rect x="0" y="30" width="180" height="160" rx="12" fill="#292524" stroke="#000" stroke-width="3" />
    <!-- Glass Bezel & CRT Screen -->
    <rect x="14" y="44" width="152" height="132" rx="8" fill="#0C0A09" stroke="#000" stroke-width="2.5" />

    <!-- Test Suite Checklist Inside CRT -->
    <text x="24" y="65" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="900">RUNNING QA SUITE v2.6</text>
    <line x1="24" y1="72" x2="156" y2="72" stroke="#44403C" stroke-width="1.5" />

    <!-- Check 1 -->
    <circle cx="32" cy="88" r="5" fill="#10B981" />
    <path d="M 29 88 L 31 90 L 35 86" stroke="#FFF" stroke-width="1.5" fill="none" />
    <text x="44" y="91" fill="#E7E5E4" font-family="monospace" font-size="9" font-weight="bold">Lighthouse 98/100</text>

    <!-- Check 2 -->
    <circle cx="32" cy="110" r="5" fill="#10B981" />
    <path d="M 29 110 L 31 112 L 35 108" stroke="#FFF" stroke-width="1.5" fill="none" />
    <text x="44" y="113" fill="#E7E5E4" font-family="monospace" font-size="9" font-weight="bold">Responsiveness: PASS</text>

    <!-- Check 3 -->
    <circle cx="32" cy="132" r="5" fill="#10B981" />
    <path d="M 29 132 L 31 134 L 35 130" stroke="#FFF" stroke-width="1.5" fill="none" />
    <text x="44" y="135" fill="#E7E5E4" font-family="monospace" font-size="9" font-weight="bold">API Auth Token: PASS</text>

    <!-- Check 4 -->
    <circle cx="32" cy="154" r="5" fill="#F43F5E" />
    <text x="44" y="157" fill="#F43F5E" font-family="monospace" font-size="9" font-weight="bold">0 Console Errors!</text>

    <!-- Monitor Stand -->
    <path d="M 60 190 L 120 190 L 130 230 L 50 230 Z" fill="#1C1917" stroke="#000" stroke-width="3" />
  </g>

  <!-- CENTER: ARCADE BUG SQUASHER & STABILITY GAUGE -->
  <g transform="translate(265, 90)">
    <!-- Big Performance Dial Gauge -->
    <circle cx="70" cy="80" r="62" fill="#292524" stroke="#000" stroke-width="3.5" />
    <circle cx="70" cy="80" r="52" fill="#0C0A09" stroke="#F43F5E" stroke-width="2" stroke-dasharray="6 3" />

    <!-- Dial Arc (99.9% Stability) -->
    <path d="M 30 100 A 46 46 0 1 1 110 100" stroke="#10B981" stroke-width="8" strokeLinecap="round" fill="none" />
    <!-- Dial Needle Pointing to High -->
    <polygon points="70,80 67,42 73,42" fill="#F43F5E" />
    <circle cx="70" cy="80" r="8" fill="#FFF" stroke="#000" stroke-width="2" />
    <text x="50" y="116" fill="#10B981" font-family="monospace" font-size="12" font-weight="900">99.9%</text>
    <text x="42" y="128" fill="#A8A29E" font-family="monospace" font-size="8">STABILITY</text>

    <!-- Retro Pixel Bug Being Squashed Underneath -->
    <g transform="translate(45, 175)">
      <!-- Bug Body (Dead/Crushed) -->
      <ellipse cx="25" cy="25" rx="18" ry="12" fill="#F43F5E" stroke="#000" stroke-width="2.5" />
      <circle cx="16" cy="20" r="3" fill="#FFF" />
      <text x="14" y="22" font-size="7" fill="#000">X</text>
      <circle cx="34" cy="20" r="3" fill="#FFF" />
      <text x="32" y="22" font-size="7" fill="#000">X</text>
      <!-- Bug Legs -->
      <line x1="8" y1="18" x2="2" y2="12" stroke="#000" stroke-width="2" />
      <line x1="8" y1="28" x2="2" y2="34" stroke="#000" stroke-width="2" />
      <line x1="42" y1="18" x2="48" y2="12" stroke="#000" stroke-width="2" />
      <line x1="42" y1="28" x2="48" y2="34" stroke="#000" stroke-width="2" />
      <!-- Whack Pow Sparks -->
      <polygon points="25,0 28,10 38,12 28,15 25,24 22,15 12,12 22,10" fill="#FDE047" stroke="#000" stroke-width="1.5" />
    </g>

    <!-- Pixel Mallet / Hammer Hovering Above -->
    <g transform="translate(75, 140) rotate(-25)">
      <rect x="0" y="0" width="12" height="48" rx="2" fill="#B45309" stroke="#000" stroke-width="2" />
      <rect x="-16" y="-14" width="44" height="22" rx="4" fill="#E11D48" stroke="#000" stroke-width="2.5" />
    </g>
  </g>

  <!-- RIGHT: BROWSER QA MATRIX WINDOWS -->
  <g transform="translate(420, 95)">
    <!-- Browser Card 1 (Mobile Screen) -->
    <rect x="0" y="10" width="85" height="150" rx="10" fill="#292524" stroke="#000" stroke-width="3" />
    <rect x="6" y="26" width="73" height="118" rx="4" fill="#0C0A09" />
    <rect x="25" y="16" width="35" height="4" rx="2" fill="#57534E" />
    <circle cx="42" cy="151" r="4" fill="#57534E" />
    <!-- Mobile App Wireframe Content -->
    <rect x="14" y="36" width="57" height="14" rx="2" fill="#10B981" />
    <rect x="14" y="56" width="57" height="40" rx="4" fill="#38BDF8" opacity="0.6" />
    <rect x="14" y="102" width="57" height="10" rx="2" fill="#F43F5E" />
    <text x="24" y="125" fill="#A8A29E" font-family="monospace" font-size="7">390x844 OK</text>

    <!-- Browser Card 2 (Desktop Tab Overlap) -->
    <g transform="translate(60, 40)">
      <rect x="0" y="0" width="100" height="85" rx="6" fill="#1C1917" stroke="#F43F5E" stroke-width="2.5" />
      <rect x="0" y="0" width="100" height="16" fill="#292524" />
      <circle cx="8" cy="8" r="2.5" fill="#EF4444" />
      <circle cx="16" cy="8" r="2.5" fill="#F59E0B" />
      <circle cx="24" cy="8" r="2.5" fill="#10B981" />
      <!-- Checkmark -->
      <circle cx="50" cy="50" r="16" fill="#10B981" stroke="#000" stroke-width="2" />
      <path d="M 42 50 L 47 55 L 58 44" stroke="#FFF" stroke-width="3" strokeLinecap="round" strokeLinejoin="round" fill="none" />
      <text x="22" y="76" fill="#FDE047" font-family="monospace" font-size="8" font-weight="bold">TESTS PASS: 100%</text>
    </g>
  </g>

  <!-- Bottom Badge -->
  <g transform="translate(200, 360)">
    <rect x="0" y="0" width="200" height="34" rx="17" fill="#000" stroke="#F43F5E" stroke-width="2.5" />
    <circle cx="22" cy="17" r="6" fill="#F43F5E" />
    <text x="38" y="22" fill="#FCE7F3" font-family="monospace" font-size="12" font-weight="900" letter-spacing="1">ZERO BUGS // STABLE</text>
  </g>
</svg>
